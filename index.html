
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MLOps Class</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #aee41b, #5b6513);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .welcome-card {
            max-width: 850px;
            width: 90%;
            padding: 60px 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            color: white;
        }

        .badge-class {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -2px;
        }

        .highlight {
            color: #60a5fa;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #dbeafe;
            margin-top: 20px;
        }

        .day {
            margin-top: 35px;
            padding: 18px 24px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <div class="welcome-card text-center">

        <span class="badge-class">
            🚀 MLOps / DevOps Training
        </span>

        <h1>
            This is <span class="highlight">MLOps Class!</span>
        </h1>

        <p class="subtitle">
            Building the future of Machine Learning Operations
        </p>

        <div class="day">
            <strong>This is Day 6 an today is sunday</strong>
            <br>
            MLOps / DevOps Class
        </div>

    </div>

</body>
</html>
